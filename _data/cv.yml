    Experience:
    - company: Partners for Public Good
      position: Project Leader, Research | Strategy and Impact
      location: Remote
      start_date: 2026-05
      end_date: present
      highlights:
      - Provide research and statistical support to values-based food purchasing projects, including mapping state purchasing thresholds for school food authorities, designing questionnaires on uptake of sustainability and nutrition goals in food procurement, and reviewing reports and white papers.
      - Co-develop funding proposals for private and public funders to build the school food procurement portfolio.
      - Lead novel research benchmarking municipal procurement functions in the U.S. using administrative, survey, and governmental data, in collaboration with local governments and procurement experts.
      - Manage research associates, fellows, and consultants, including training in qualitative and quantitative research methods.
    - company: Massachusetts College of Pharmacy and Health Sciences
      position: Adjunct Faculty, Pharmaceutical Economics and Policy
      location: Boston, MA
      start_date: 2026-01
      end_date: present
      highlights:
      - 'Instructor for PEP 809: Statistical Programming in R; develop syllabi, lectures, assignments, and assessments.'
      - Teach R, RStudio, and Git/GitHub to master's students, covering programming foundations, data management, statistical methods, and data visualization.
    - company: Kurtosis Research
      position: Research Consultant
      location: Durham, NC
      start_date: 2025-10
      end_date: present
      highlights:
      - Support a Robert Wood Johnson Foundation Healthy Eating Research-funded review of community nutrition and social policy effects on weight, food security, and health outcomes.
      - Lead mixed-methods analysis of a randomized experiment to increase take-up of Earned Income Tax Credit benefits among California WIC participants.
      - Provide biostatistical, study design, and manuscript consulting to partners in the biomedical and clinical sciences.
    - company: Harvard John F. Kennedy School of Government
      position: Postdoctoral Fellow, Taubman Center for State and Local Government
      location: Cambridge, MA
      start_date: 2025-07
      end_date: 2026-05
      highlights:
      - Led evaluation of a guaranteed income intervention in Chelsea, MA, which increased total calories by 11%, fruit by 14%, and total vegetable consumption by 16%.
      - Applied econometric and quantitative methods to evaluate local government policies and programs with respect to implementation, burden, scalability, and resident wellbeing.
      - Used machine learning on unstructured call text (BERT and other large language models) to estimate the causal effects of alternative emergency response in Los Angeles, CA, on behavioral health.
      - Conducted mixed-methods research on causes of homelessness in Detroit, MI, to improve housing crisis call scripts and referral infrastructure for residents facing eviction.
    - company: Harvard T.H. Chan School of Public Health
      position: Postdoctoral Research Fellow, Social Policies for Health Equity Research Center (SPHERE)
      location: Boston, MA
      start_date: 2024-08
      end_date: 2025-07
      highlights:
      - Estimated causal effects of social policies on health and nutrition using observational and experimental data, high-performance computing, and econometric methods, including COVID-19 county-level policies and child cardiometabolic health (restricted Census data) and state paid family leave and perinatal health.
      - Led independent analyses of COVID-19 waivers for SNAP and WIC on administrative burden and program utilization, and of adherence to US dietary guidelines and child health trajectories through adolescence.
    - company: Harvard T.H. Chan School of Public Health
      position: Nutrition Policy Researcher, Department of Nutrition
      location: Boston, MA
      start_date: 2020-01
      end_date: 2024-05
      highlights:
      - Led data analysis, code review, and manuscript development on nutrition policies addressing childhood obesity, food access, and food insecurity, including nutrition assistance programs, sweetened beverage excise taxes, and targeted food and beverage marketing.
    - company: Harvard T.H. Chan School of Public Health
      position: Cost-Effectiveness Researcher, Department of Social and Behavioral Sciences
      location: Boston, MA
      start_date: 2020-01
      end_date: 2024-05
      highlights:
      - Conducted microsimulation-based cost-effectiveness analyses of US policy interventions and their long-run impacts on health spending, obesity, morbidity, and mortality.
      - Developed the R backend for processing simulation output (tables, figures, and sensitivity logs), now incorporated in the Childhood Obesity Interventions Cost-Effectiveness Study (CHOICES) microsimulation model.
    - company: University of California, Berkeley School of Public Health
      position: Researcher, Community Health Sciences
      location: Berkeley, CA
      start_date: 2017-08
      end_date: 2019-05
      highlights:
      - Managed quasi-experimental evaluation of sugary beverage taxes in Oakland, Berkeley, and San Francisco; oversaw a team of 30 researchers.
      - Supported analyses for the Fit Study, a three-year cluster-randomized trial of BMI screening and reporting.
      - Led spatial analyses of targeted beverage marketing in San Francisco and spillover effects of physical education lawsuits on California district PE policies.
